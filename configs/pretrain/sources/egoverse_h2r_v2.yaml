  modalities:
    video_concat: single_masked
    video: {}
  slow_motion_factor: 2.0
  task_index_authority: episode_metadata
  prompt_template: 'A video recorded from a robot''s first-person point of view executing the following
    instruction: {task}'
  action_loss_weight: 0.1
  action_gripper_loss_weight: 0.01
  name: human2robot_ur5e_wsg50_robotwin__left-right
  adapter: h2r_ur5e
  stats_group: human2robot_ur5e_wsg50_robotwin__left-right
  canonical_adapter:
    slots:
      left:
        ee:
          state_validity_key: observation.valid
          action_validity_key: action.valid
          validity_raw_slice:
          - 0
          - 1
        gripper:
          state_validity_key: observation.valid
          action_validity_key: action.valid
          validity_raw_slice:
          - 0
          - 1
        joint:
          state_validity_key: observation.valid
          action_validity_key: action.valid
          validity_raw_slice:
          - 0
          - 1
      right:
        ee:
          state_validity_key: observation.valid
          action_validity_key: action.valid
          validity_raw_slice:
          - 0
          - 1
        gripper:
          state_validity_key: observation.valid
          action_validity_key: action.valid
          validity_raw_slice:
          - 0
          - 1
        joint:
          state_validity_key: observation.valid
          action_validity_key: action.valid
          validity_raw_slice:
          - 0
          - 1
  sampling_family: ego2robot
  action_loss_normalization: weighted_valid_cells
  root: egoverse_h2r_v2/ur5e_wsg50_robotwin
  datasets_glob: '**'
