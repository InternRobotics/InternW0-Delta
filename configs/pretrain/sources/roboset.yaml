normalization_stats: ${oc.env:WAM_PRETRAIN_STATS,assets/stats/pretrain}/roboset.json
sources:
- name: roboset_baking_prep_scene_1
  enabled: true
  adapter: adapter_roboset_single_joint
  format_version: v2
  root: roboset/baking_prep/scene_1
  stats_group: roboset/franka
  datasets:
  - baking_prep_pick_butter_scene_1
  - baking_prep_place_butter_scene_1
  - baking_prep_slide_close_drawer_scene_1
  - baking_prep_slide_open_drawer_scene_1
  modalities:
    video:
      keys:
      - observation.images.top
      - observation.images.wrist
    video_concat: vertical
  sampling_family: real
  action_loss_normalization: legacy_per_sample
