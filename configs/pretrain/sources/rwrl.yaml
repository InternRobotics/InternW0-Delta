normalization_stats: ${oc.env:WAM_PRETRAIN_STATS,assets/stats/pretrain}/rwrl.json
sources:
- action_loss_normalization: legacy_per_sample
  allow_padding_at_end: false
  dataset_weight: 1.0
  distribute_weights: false
  enabled: true
  format_version: v2
  modalities:
    action:
      key: derived.action80
    frame_index:
      key: frame_index
    state:
      key: derived.state80
    task_index:
      key: task_index
    timestamp:
      key: timestamp
    video:
      keys:
      - observation.images.camera_top
      - observation.images.camera_wrist_left
      - observation.images.camera_wrist_right
      timestamp_source: timestamp
    video_concat: robotwin
  prompt_template: 'A video recorded from a robot''s point of view executing the following
    instruction: {task}'
  sampling_family: real
  slow_motion_factor: 1.0
  stats_group: processed/rwrl_g2a/native_unidentified
