            raw_slice:
            - 0
            - 1
            target_slice:
            - 16
            - 17
        right:
          joint:
            state_key: states.right_joint.position
            action_key: actions.right_joint.position
            raw_slice:
            - 0
            - 6
            target_slice:
            - 40
            - 46
          ee:
            state_key: states.right_ee.position
            action_key: actions.right_ee.position
