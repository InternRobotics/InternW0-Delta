            state_key: observation.states.joint_position_right
            action_key: actions.joint_position_right
            raw_slice:
            - 6
            - 7
            target_slice:
            - 56
            - 57
    modalities:
      state:
        keys:
        - observation.states.joint_position_left
        - observation.states.joint_position_right
      action:
        keys:
        - actions.joint_position_left
        - actions.joint_position_right
      video:
        key: auto
      language:
        source: meta/tasks.jsonl
      timestamp:
        key: timestamp
      frame_index:
        key: frame_index
      task_index:
        key: task_index
