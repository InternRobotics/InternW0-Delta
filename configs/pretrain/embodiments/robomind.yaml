embodiments:
  adapter_robomind_agilex_joint_only:
    control_schema: dual_arm
    canonical_adapter:
      layout: robot
      missing_policy: pad_and_mask
      slots:
        left:
          joint:
            state_key: observation.states.joint_position_left
            action_key: actions.joint_position_left
            raw_slice:
            - 0
            - 6
            target_slice:
            - 0
            - 6
          ee:
            pad: true
          gripper:
            state_key: observation.states.joint_position_left
            action_key: actions.joint_position_left
            raw_slice:
            - 6
            - 7
            target_slice:
            - 16
            - 17
        right:
