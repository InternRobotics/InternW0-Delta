embodiments:
  adapter_a1_dual_ee_to_robot:
    control_schema: dual_arm
    canonical_adapter:
      layout: robot
      pose_input: xyz_quat_wxyz
      action_pose_semantics: absolute_target
      state_pose_output: xyz_rot6d
      action_pose_output: xyz_rotvec
      missing_policy: pad_and_mask
      frame_transform:
        world_from_source: robot_to_opencv
        source_ee_from_canonical_ee: ee_source_z_to_canonical_z
      slots:
        left:
          joint:
            state_key: states.left_joint.position
            action_key: actions.left_joint.position
            raw_slice:
            - 0
            - 6
            target_slice:
            - 0
            - 6
          ee:
            state_key: states.left_tcp_to_robot_pose
            action_key: actions.left_tcp_to_robot_pose
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 7
            - 16
            action_target_slice:
            - 7
            - 13
          gripper:
            state_key: states.left_gripper.position
            action_key: actions.left_gripper.position
            raw_slice:
            - 0
            - 1
            target_slice:
            - 16
            - 17
        right:
          joint:
            state_key: states.right_joint.position
            action_key: actions.right_joint.position
            raw_slice:
            - 0
            - 6
            target_slice:
            - 40
            - 46
          ee:
            state_key: states.right_tcp_to_robot_pose
            action_key: actions.right_tcp_to_robot_pose
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 47
            - 56
            action_target_slice:
            - 47
            - 53
          gripper:
            state_key: states.right_gripper.position
            action_key: actions.right_gripper.position
            raw_slice:
            - 0
            - 1
            target_slice:
            - 56
            - 57
    modalities:
      state:
        keys:
        - states.left_joint.position
        - states.left_tcp_to_robot_pose
        - states.left_gripper.position
        - states.right_joint.position
        - states.right_tcp_to_robot_pose
        - states.right_gripper.position
      action:
        keys:
        - actions.left_joint.position
        - actions.left_tcp_to_robot_pose
        - actions.left_gripper.position
        - actions.right_joint.position
        - actions.right_tcp_to_robot_pose
        - actions.right_gripper.position
      video:
        key: auto
      language:
        source: meta/tasks.parquet
      timestamp:
        key: timestamp
      frame_index:
        key: frame_index
      task_index:
        key: task_index
