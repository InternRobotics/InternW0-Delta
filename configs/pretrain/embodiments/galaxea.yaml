embodiments:
  adapter_r1lite_state_ee_derivative:
    control_schema: dual_arm
    notes:
    - Galaxea action arm and EEF fields are controller targets at row t.
    - WAM action keeps the absolute joint targets and converts the absolute EEF targets to deltas from
      state[t].
    - Gripper remains the absolute controller command at row t.
    canonical_adapter:
      layout: robot
      pose_input: xyz_quat_xyzw
      action_pose_input: xyz_quat_xyzw
      state_pose_output: xyz_rot6d
      action_pose_output: xyz_rotvec
      missing_policy: pad_and_mask
      slots:
        left:
          joint:
            state_key: observation.state.left_arm
            action_key: action.left_arm
            raw_slice:
            - 0
            - 6
            target_slice:
            - 0
            - 6
          ee:
            state_key: observation.state.left_ee_pose
            action_key: action.left_ee_pose
            action_pose_semantics: absolute_target
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 7
            - 16
            action_target_slice:
            - 7
            - 13
          gripper:
            state_key: observation.state.left_gripper
            action_key: action.left_gripper
            raw_slice:
            - 0
            - 1
            target_slice:
            - 16
            - 17
        right:
          joint:
            state_key: observation.state.right_arm
            action_key: action.right_arm
            raw_slice:
            - 0
            - 6
            target_slice:
            - 40
            - 46
          ee:
            state_key: observation.state.right_ee_pose
            action_key: action.right_ee_pose
            action_pose_semantics: absolute_target
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 47
            - 56
            action_target_slice:
            - 47
            - 53
          gripper:
            state_key: observation.state.right_gripper
            action_key: action.right_gripper
            raw_slice:
            - 0
            - 1
            target_slice:
            - 56
            - 57
    modalities:
      state:
        keys:
        - observation.state.left_arm
        - observation.state.left_ee_pose
        - observation.state.left_gripper
        - observation.state.right_arm
        - observation.state.right_ee_pose
        - observation.state.right_gripper
      action:
        keys:
        - action.left_arm
        - action.left_ee_pose
        - action.left_gripper
        - action.right_arm
        - action.right_ee_pose
        - action.right_gripper
      video:
        key: auto
      language:
        source: meta/tasks.jsonl
      timestamp:
        key: timestamp
      frame_index:
        key: frame_index
      task_index:
        key: task_index
