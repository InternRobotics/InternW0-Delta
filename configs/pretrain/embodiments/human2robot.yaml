              - - -1.0
                - -3.6732051285071066e-06
                - 0.0
              - - 3.6732051285071066e-06
                - -1.0
                - 8.680565697029481e-17
              delta_frame: eef_local
              world_from_source: identity
            raw_slice:
            - 0
            - 6
            state_key: observation.state.left_eef_pose_camera
            state_target_slice:
            - 7
            - 16
          gripper:
            action_key: action.left_gripper_opening
            raw_slice:
            - 0
            - 1
            state_key: observation.state.left_gripper_opening
            target_slice:
            - 16
            - 17
