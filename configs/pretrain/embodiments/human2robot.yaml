embodiments:
  h2r_mobile_aloha:
    control_schema: dual_arm
    canonical_adapter:
      action_pose_output: xyz_rotvec
      action_pose_semantics: state_delta_common
      layout: robot
      missing_policy: pad_and_mask
      pose_input: xyz_rotvec
      slots:
        left:
          ee:
            action_key: action.left_eef_delta_local
            action_target_slice:
            - 7
            - 13
            frame_transform:
              canonical_ee_convention: approach-right_to_left-up-v1
              canonical_ee_from_source_ee:
              - - -3.1885497780478936e-22
