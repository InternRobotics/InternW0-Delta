sampling:
  num_frames: 33
  action_size: 32
  global_sample_stride: 1
  action_video_freq_ratio: 4
  memory_video_anchor_size: 1
  memory_recent_frame_offset: 32
mixture:
  allow_padding_at_end: false
  balance_dataset_weights: false
  balance_trajectory_weights: true
  bucket_wave_apply_dataset_weights: true
  bucket_wave_cyclic_families:
  - umi
  - ego2robot
  - ego
  bucket_wave_epoch_anchor_family: real
  dataset_weight_mode: family_grouped
  episode_block_tile_size: 64
  eval_subset:
    exclude_from_training: none
    fixed_per_dataset: false
    scope: source_type
    total_samples: 1000
  family_groups:
    ego:
      high_quality:
        allocation: valid_start_count
        datasets:
        - egodex
        - aria
        - lightwheel
        weight: 0.8
      lower_quality:
        allocation: uniform
        datasets:
        - mecka
        - scale
        - microagi
        weight: 0.2
  family_weights:
    real: 0.8
    umi: 0.08
    ego2robot: 0.1
    ego: 0.02
  seed: 20260911
  training: true
  training_batch_size_per_rank: 16
  training_block_size: 4
  training_sampling_strategy: optimizer_stratified_without_replacement
embodiment_files:
- embodiments/human.yaml
- embodiments/human2robot.yaml
