defaults:
  - ebench
  - _self_

# Ebench post-training with BOTH representations, mirroring pretraining:
#   * joint  : absolute joint targets              -> left [0,6)   / right [40,46)
#   * eef    : native per-step world delta pose    -> left [7,13)  / right [47,53)
#   * state  : joints + xyz/rot6d EE pose          -> ee left [7,16) / right [47,56)
#   * gripper apertures [16,17) / [56,57); planar mobile base [77,80)
#
# No coordinate-frame conversion is applied to the EE fields (same policy as
# the LIBERO 80-D adapter): positions stay in Ebench's native frame, and only
# the rotation parameterization is changed by EbenchDualArmEEPoseTransform
# (state quat(wxyz) -> column-first rot6d, action dquat(wxyz) -> rotvec).

train:
  shape_meta:
    action: &ebench_joint_ee_action_meta
      - key: joints
        lerobot_key: action.joints
        raw_shape: 12
        shape: 12
      - key: gripper
        lerobot_key: action.gripper
        raw_shape: 4
        # Two finger displacements per gripper become one physical aperture.
        shape: 2
      - key: base
        lerobot_key: action.base_delta
        raw_shape: 3
        shape: 3
      - key: ee
        # [left, right] x (dxyz + dquat wxyz) -> [left, right] x (dxyz + rotvec)
        lerobot_key: action.ee_pose_delta
        raw_shape: 14
        shape: 12
    state: &ebench_joint_ee_state_meta
      - key: joints
        lerobot_key: state.joints
        raw_shape: 12
        shape: 12
      - key: gripper
        lerobot_key: state.gripper
        raw_shape: 4
        shape: 2
      - key: base
        lerobot_key: state.base
        raw_shape: 3
        shape: 3
      - key: ee
        # [left, right] x (xyz + quat wxyz) -> [left, right] x (xyz + rot6d)
        lerobot_key: state.ee_pose
        raw_shape: 14
        shape: 18

  # Statistics use transformed apertures, rotation-6D states and rotation-vector actions.
  pretrained_norm_stats: ${oc.env:EBENCH_JOINT_EE_NORM_STATS,${paths.ebench}/dataset_stats_joint_ee.json}

  processor:
    shape_meta:
      action: *ebench_joint_ee_action_meta
      state: *ebench_joint_ee_state_meta
    # Base and EE commands are deltas: padded steps become zero.  Padded
    # joint/gripper targets keep their last absolute value.
    delta_action_dim_mask:
      joints: [false, false, false, false, false, false, false, false, false, false, false, false]
      gripper: [false, false]
      base: [true, true, true]
      ee: [true, true, true, true, true, true, true, true, true, true, true, true]
    action_state_transforms:
      - _target_: wam.datasets.lerobot.transforms.ebench_80d.EbenchParallelGripperTransform
        action_key: gripper
        state_key: gripper
      - _target_: wam.datasets.lerobot.transforms.ebench_80d.EbenchDualArmEEPoseTransform
        action_key: ee
        state_key: ee
    # Joints / gripper / base use z-score.  EE fields (absolute xyz state and
    # per-step dxyz + rotvec deltas) use min/max range scaling to [-1, 1].
    norm_default_mode: z-score
    norm_exception_mode:
      action:
        ee: min/max
      state:
        ee: min/max
    # state.ee rot6d coordinates are already bounded in [-1, 1]; keep them raw,
    # exactly as the pretraining stats do (passthrough_dims in mix configs).
    normalization_passthrough_dims:
      state:
        ee: [3, 4, 5, 6, 7, 8, 12, 13, 14, 15, 16, 17]
    action_state_merger:
      _target_: wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      action_target_dim: 80
      state_target_dim: 80
      # Transformed concat order (= shape_meta order):
      #   action: joints (12) | apertures (2) | base (3) | ee dxyz+rotvec x2 (12)
      #   state : joints (12) | apertures (2) | base (3) | ee xyz+rot6d  x2 (18)
      action_target_slices:
        - source_slice: [0, 6]
          target_slice: [0, 6]
        - source_slice: [6, 12]
          target_slice: [40, 46]
        - source_slice: [12, 13]
          target_slice: [16, 17]
        - source_slice: [13, 14]
          target_slice: [56, 57]
        - source_slice: [14, 17]
          target_slice: [77, 80]
        - source_slice: [17, 23]
          target_slice: [7, 13]
        - source_slice: [23, 29]
          target_slice: [47, 53]
      state_target_slices:
        - source_slice: [0, 6]
          target_slice: [0, 6]
        - source_slice: [6, 12]
          target_slice: [40, 46]
        - source_slice: [12, 13]
          target_slice: [16, 17]
        - source_slice: [13, 14]
          target_slice: [56, 57]
        - source_slice: [14, 17]
          target_slice: [77, 80]
        - source_slice: [17, 26]
          target_slice: [7, 16]
        - source_slice: [26, 35]
          target_slice: [47, 56]

val:
  shape_meta:
    action: *ebench_joint_ee_action_meta
    state: *ebench_joint_ee_state_meta
  # pretrained_norm_stats / processor already interpolate ${data.train.*}.

# The VAE latent cache is keyed on images only, so the joint-only cache at
# the inherited root can be shared by this variant unchanged.
